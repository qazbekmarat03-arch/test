            background-color: #f0fdf4; /* Very light green */

                radial-gradient(circle at 15px 15px, rgba(0, 128, 0, 0.1) 1px, transparent 0);
            background-size: 30px 30px;
        }
        .gradient-btn {
            background-image: linear-gradient(to right, #22c55e, #16a34a);
            transition: all 0.3s ease;
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(22, 163, 74, 0.2), 0 4px 6px -2px rgba(22, 163, 74, 0.1);
        }
        .progress-bar-inner {
            transition: width 0.5s ease-in-out;
        }
        .lesson-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .lesson-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .completed-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #16a34a;
            border-radius: 0.75rem;
            backdrop-filter: blur(2px);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .solution-iframe {
            width: 100%;
            height: calc(90vh - 100px); /* Adjust height for header/footer in modal */
            border: none;
            border-radius: 0.5rem;
        }
        .test-question-container {
            margin-bottom: 1rem;
            padding: 1rem;
            background-color: #f9fafb;
            border-radius: 0.5rem;
        }
        .test-option-label {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

            margin-right: 0.75rem;

        }
        .math {
            font-family: 'Times New Roman', serif; /* Ensure MathJax renders nicely */

            },
            {
                id: 15, title: '№15 Күрделі теңдеулер', video: 'https://www.youtube.com/watch?v=NIvFXIdjDDU',
                homework: null, solution: null,
                test: { questions: [{ q: 'Рационал теңдеулерді шешу үшін не істеу керек?', options: ['Бөлшектерді ортақ бөлімге келтіру', 'Айнымалыны ауыстыру', 'Квадрат теңдеуге келтіру', 'Бәрі дұрыс'], ans: 'Бөлшектерді ортақ бөлімге келтіру' }] }
            },
            {
                id: 16, title: '№16 Комбинаторика және ықтималдық', video: 'https://www.youtube.com/watch?v=eciVBVMv3Vo',
                homework: 'https://drive.google.com/file/d/13lg7xuyXqjUNBZzVFOQtVNbbXtAxEg7A/view?usp=sharing',
                solution: 'https://drive.google.com/file/d/13lg7xuyXqjUNBZzVFOQtVNbbXtAxEg7A/view?usp=sharing',
                test: { questions: [{ q: 'Комбинаторика нені зерттейді?', options: ['Мүмкін болатын орналасулар саны', 'Сандар қатарын', 'Функциялардың қасиеттерін', 'Геометриялық фигураларды'], ans: 'Мүмкін болатын орналасулар саны' }] }
            },
        ];

        let currentUserProgress = {}; // Object to store progress for the logged-in user
        let unsubscribeProgress;
        let currentLessonForTest = null;

        // Utility function to show a custom modal message
        function showMessageModal(message) {
            messageModalText.textContent = message;
            messageModal.classList.remove('hidden');
        }
        messageModalCloseBtn.addEventListener('click', () => messageModal.classList.add('hidden'));

        // Utility to encode email for Firestore document paths
        function encodeEmail(email) {
            return encodeURIComponent(email).replace(/\./g, '%2E');
        }

        // Render lessons based on current user progress
        function renderLessons() {
            lessonsGrid.innerHTML = '';
            let completedCount = 0;

            lessons.forEach(lesson => {
                const progress = currentUserProgress[lesson.id] || { watched: false, homeworkDone: false, testPassed: false, score: null };
                const isCompleted = progress.testPassed; // Lesson is complete only if test is passed
                const canTakeTest = progress.watched && progress.homeworkDone;
                const canViewSolution = progress.testPassed && lesson.solution;

                if (isCompleted) {
                    completedCount++;
                }

                const homeworkLinks = Array.isArray(lesson.homework) ? lesson.homework : (lesson.homework ? [lesson.homework] : []);
                const homeworkButtons = homeworkLinks.length > 0
                    ? homeworkLinks.map((link, index) => `<a href="${link}" target="_blank" rel="noopener noreferrer" class="gradient-btn mt-2 inline-block text-white font-semibold py-2 px-5 rounded-lg shadow-md w-full text-center text-sm">Үй тапсырмасы ${homeworkLinks.length > 1 ? index + 1 : ''}</a>`).join('')
                    : `<div class="mt-2 text-center text-gray-500 italic py-2 px-5 w-full text-sm">Үй тапсырмасы жоқ</div>`;

                const markHomeworkButton = `<button data-id="${lesson.id}" class="mark-homework-btn w-full mt-2 py-2 px-4 rounded-md font-semibold text-sm ${progress.homeworkDone ? 'bg-green-100 text-green-700 cursor-not-allowed' : 'bg-gray-200 text-gray-700 hover:bg-green-200'}" ${progress.homeworkDone ? 'disabled' : ''}>
                    ${progress.homeworkDone ? 'Үй тапсырмасы орындалды ✔️' : 'Үй тапсырмасын орындадым'}
                </button>`;

                const testButton = `<button data-id="${lesson.id}" class="take-test-btn w-full mt-2 py-2 px-4 rounded-md font-semibold text-sm ${canTakeTest ? 'gradient-btn text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}" ${!canTakeTest ? 'disabled' : ''}>
                    ${progress.testPassed ? `Тест (${progress.score}%) қайта тапсыру` : 'Тест тапсыру'}
                </button>`;

                const solutionButton = `<button data-id="${lesson.id}" class="view-solution-btn w-full mt-2 py-2 px-4 rounded-md font-semibold text-sm ${canViewSolution ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}" ${!canViewSolution ? 'disabled' : ''}>
                    Шешімі
                </button>`;

                const card = `
                    <div class="lesson-card bg-white rounded-xl shadow-lg overflow-hidden relative p-5">
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${lesson.title}</h3>
                        <a href="${lesson.video}" target="_blank" rel="noopener noreferrer" data-id="${lesson.id}" class="watch-video-btn text-green-600 hover:text-green-800 font-medium flex items-center mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                            Видеосабақты көру ${progress.watched ? '✔️' : ''}
                        </a>
                        ${homeworkButtons}
                        ${markHomeworkButton}
                        ${testButton}
                        ${solutionButton}
                        ${isCompleted ? '<div class="completed-overlay">✔️ Аяқталды</div>' : ''}
                    </div>
                `;
                lessonsGrid.insertAdjacentHTML('beforeend', card);
            });

            // Update progress bar
            const totalLessons = lessons.length;
            const percentage = totalLessons > 0 ? (completedCount / totalLessons) * 100 : 0;
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${completedCount}/${totalLessons} сабақ аяқталды`;

            // Render MathJax
            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise();
            }
        }

        // Update user progress in Firestore
        async function updateProgress(lessonId, field, value) {
            const userEmail = sessionStorage.getItem('mathUserEmail');
            if (!userEmail) {
                showMessageModal('Курс прогрессін сақтау үшін жүйеге кіріңіз.');
                return;
            }

            const safeEmail = encodeEmail(userEmail);
            const progressDocRef = doc(db, `artifacts/${appId}/users/${safeEmail}/progress`, 'lessons_status');

            try {
                // Ensure currentUserProgress is initialized for the lesson
                if (!currentUserProgress[lessonId]) {
                    currentUserProgress[lessonId] = { watched: false, homeworkDone: false, testPassed: false, score: null };
                }
                currentUserProgress[lessonId][field] = value;

                // Create a temporary object for Firestore update to avoid overwriting other lesson data
                const updateObject = {};
                updateObject[lessonId] = currentUserProgress[lessonId];

                await setDoc(progressDocRef, updateObject, { merge: true });
                renderLessons(); // Re-render to reflect changes
            } catch (e) {
                console.error("Error updating progress:", e);
                showMessageModal("Прогрессті жаңарту кезінде қате кетті.");
            }
        }

        // Setup Firestore listener for user progress
        function setupProgressListener(userEmail) {
            if (unsubscribeProgress) unsubscribeProgress(); // Unsubscribe from previous listener

            const safeEmail = encodeEmail(userEmail);
            const progressDocRef = doc(db, `artifacts/${appId}/users/${safeEmail}/progress`, 'lessons_status');

            unsubscribeProgress = onSnapshot(progressDocRef, (docSnap) => {
                currentUserProgress = docSnap.exists() ? docSnap.data() : {};
                renderLessons();
            }, (error) => {
                console.error("Error listening to progress:", error);
                // Optionally show a user-friendly message
            });
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            const email = emailInput.value.trim().toLowerCase();
            const code = codeInput.value.trim();

            if (!email || !code) {
                showMessageModal('Email мен кодты толық енгізіңіз.');
                return;
            }

            try {
                const docRef = doc(db, "access_codes", email);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().code === code) {
                    sessionStorage.setItem('mathUserEmail', email);
                    initializeAppView(email);
                } else {
                    showMessageModal('Email немесе код қате. Деректерді тексеріп, қайталап көріңіз.');
                }
            } catch (error) {
                console.error("Login error:", error);
                showMessageModal('Жүйеге кіру кезінде техникалық қате пайда болды.');
            }
        }

        // Initialize app view after successful login
        function initializeAppView(email) {
            userEmailEl.textContent = email;
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            setupProgressListener(email);
        }

        // Event listener for lesson actions (video, homework, test, solution)
        lessonsGrid.addEventListener('click', (e) => {
            const target = e.target;
            const lessonId = parseInt(target.dataset.id);
            const lesson = lessons.find(l => l.id === lessonId);

            if (!lesson) return;

            if (target.classList.contains('watch-video-btn')) {
                updateProgress(lessonId, 'watched', true);
            } else if (target.classList.contains('mark-homework-btn')) {
                if (!currentUserProgress[lessonId] || !currentUserProgress[lessonId].homeworkDone) {
                    updateProgress(lessonId, 'homeworkDone', true);
                }
            } else if (target.classList.contains('take-test-btn')) {
                currentLessonForTest = lesson;
                displayTestModal();
            } else if (target.classList.contains('view-solution-btn')) {
                displaySolutionModal(lesson);
            }
        });

        // Test Modal Functions
        function displayTestModal() {
            if (!currentLessonForTest) return;

            testModalTitle.textContent = `${currentLessonForTest.title} Тест`;
            testQuestionsContainer.innerHTML = ''; // Clear previous questions

            currentLessonForTest.test.questions.forEach((qData, index) => {
                const questionHtml = `
                    <div class="test-question-container">
                        <p class="font-medium text-lg mb-2"><span class="mr-2">${index + 1}.</span> <span class="math">${qData.q}</span></p>
                        ${qData.options.map((option, optIndex) => `
                            <label class="test-option-label">
                                <input type="radio" name="question-${index}" value="${option}" class="form-radio h-5 w-5">
                                <span class="text-base math">${option}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                testQuestionsContainer.insertAdjacentHTML('beforeend', questionHtml);
            });

            // Re-render MathJax in the test modal
            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise(testQuestionsContainer);
            }
            testModal.classList.remove('hidden');
        }

        testSubmitBtn.addEventListener('click', async () => {
            if (!currentLessonForTest) return;

            let correctAnswers = 0;
            const totalQuestions = currentLessonForTest.test.questions.length;

            currentLessonForTest.test.questions.forEach((qData, index) => {
                const selectedOption = document.querySelector(`input[name="question-${index}"]:checked`);
                if (selectedOption && selectedOption.value === qData.ans) {
                    correctAnswers++;
                }
            });

            const score = (correctAnswers / totalQuestions) * 100;
            let message = '';
            if (score >= 50) {
                message = `Құттықтаймыз! Сіз тесттен өттіңіз (${score.toFixed(0)}%). Енді шешімдерді көре аласыз.`;
                await updateProgress(currentLessonForTest.id, 'testPassed', true);
                await updateProgress(currentLessonForTest.id, 'score', score.toFixed(0));
            } else {
                message = `Өкінішке орай, тесттен өте алмадыңыз (${score.toFixed(0)}%). Қайтадан тапсырып көріңіз.`;
            }

            showMessageModal(message);
            testModal.classList.add('hidden');
            currentLessonForTest = null; // Reset
        });

        testCancelBtn.addEventListener('click', () => {
            testModal.classList.add('hidden');
            currentLessonForTest = null;
        });

        // Solution Modal Functions
        function displaySolutionModal(lesson) {
            if (!lesson.solution) {
                showMessageModal('Бұл сабақ үшін шешімдер жоқ.');
                return;
            }
            solutionModalTitle.textContent = `${lesson.title} Шешімдері`;
            solutionIframe.src = lesson.solution;
            solutionModal.classList.remove('hidden');
        }

        solutionCloseBtn.addEventListener('click', () => {
            solutionModal.classList.add('hidden');
            solutionIframe.src = ''; // Clear iframe src to stop loading
        });

        // Main function to start the app
        async function main() {
            try {
                // Sign in anonymously to get permissions for Firestore
                await signInAnonymously(auth);
                console.log("Authenticated anonymously.");

                // Check for a logged-in user on page load
                const storedEmail = sessionStorage.getItem('mathUserEmail');
                if (storedEmail) {
                    initializeAppView(storedEmail);
                }
            } catch(error) {
                console.error("Authentication or initialization failed:", error);
                showMessageModal("Қолданбаны іске қосу мүмкін болмады. Бетті қайта жүктеп көріңіз.");
            }
        }

        // Run the main function when the page is loaded
        document.addEventListener('DOMContentLoaded', main);

    </script>

</body>
